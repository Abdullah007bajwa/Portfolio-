<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>

        padding: 0;

        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        background: #ffffff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 600px;
        margin: 1rem;
      }
      h1 {
        margin-bottom: 1rem;
        color: #333;
      }
      p {
        margin-bottom: 1.5rem;
        color: #555;
        font-size: 1.1rem;
      }
      a {
        display: inline-block;
        background: #039be5;
        color: #fff;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: background 0.3s ease;
      }
      a:hover {
        background: #0288d1;
      }

  </head>

    <div class="container">
      <h1>Welcome to My Portfolio</h1>
